<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Терминал Доступа</title>
    <style>
        /* Минималистичные стили для формы ввода */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .terminal-box {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #2d2d2d;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #007aff;
        }

        button {
            padding: 12px 20px;
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0062cc;
        }

        #status-message {
            font-size: 14px;
            height: 20px;
            color: #ff453a; /* Красный цвет для ошибок */
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h1>Введите код доступа</h1>
        
        <div class="input-group">
            <input type="text" id="secret-input" placeholder="Код..." autocomplete="off">
            <button onclick="submitSecretCode()">Войти</button>
        </div>
        
        <!-- Блок, куда скрипт будет выводить статус загрузки или ошибки -->
        <div id="status-message"></div>
    </div>

    <script>
        // Функция отправки кода на бэкенд
        async function submitSecretCode() {
            const inputField = document.getElementById('secret-input');
            const statusField = document.getElementById('status-message');
            
            if (!inputField) return;
            const userValue = inputField.value.trim();

            // Проверка на пустое поле
            if (!userValue) {
                if (statusField) {
                    statusField.style.color = '#ff453a';
                    statusField.innerText = "Поле ввода пусто!";
                }
                return;
            }

            const workerUrl = 'https://veselchakhappy.aaa-aaaaaaa-aaa.workers.dev/'; 

            try {
                if (statusField) {
                    statusField.style.color = '#eaeaea'; // Цвет для статуса загрузки
                    statusField.innerText = "Проверка кода...";
                }

                // Отправка AJAX-запроса (POST) на Cloudflare Worker
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: userValue })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    if (statusField) statusField.innerText = "";

                    // МАТЕРИАЛИЗАЦИЯ СТРАНИЦЫ: стираем старый сайт и пишем присланный с сервера HTML
                    document.open();
                    document.write(result.html);
                    document.close();

                    // Визуально меняем URL в строке браузера (например, станет: ваш-сайт.ru/robot)
                    window.history.pushState({}, "", "/" + userValue.toLowerCase().trim());
                } else {
                    // Выводим ошибку, присланную с сервера ("Неверный код доступа.")
                    if (statusField) {
                        statusField.style.color = '#ff453a';
                        statusField.innerText = result.error || "Ошибка доступа.";
                    }
                }
            } catch (error) {
                console.error("Сетевая ошибка:", error);
                if (statusField) {
                    statusField.style.color = '#ff453a';
                    statusField.innerText = "Не удалось связаться с сервером.";
                }
            }
        }

        // Позволяет отправлять код по нажатию клавиши Enter в поле ввода
        document.getElementById('secret-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                submitSecretCode();
            }
        });
    </script>
</body>
</html>
