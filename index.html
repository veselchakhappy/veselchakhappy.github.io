<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мы скоро встретимся вновь...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
		
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: slowMove 10s ease-in-out infinite;
        }
		
        .main-text {
            font-size: 2.5rem;
            text-align: center;
            user-select: none;
            letter-spacing: 2px;
            color: #ffffff;
            animation: brightnessGlow 3s ease-in-out infinite;
        }
		
        .secret-text {
            font-size: 1.2rem;
            text-align: center;
            color: #000000;
            letter-spacing: 1px;
        }
		
        @keyframes slowMove {
            0% { transform: translate(0, 0); }
            25% { transform: translate(15px, -10px); }
            50% { transform: translate(-10px, 15px); }
            75% { transform: translate(-15px, -5px); }
            100% { transform: translate(0, 0); }
        }
		
        @keyframes brightnessGlow {
            0%, 100% { 
                text-shadow: 0 0 0px rgba(255, 255, 255, 0); 
            }
            50% { 
                text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 
                             0 0 25px rgba(255, 255, 255, 0.4); 
            }
        }

        @media (max-width: 768px) {
            .main-text { font-size: 1.8rem; }
            .secret-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-text">Мы скоро встретимся вновь...</div>
        <div class="secret-text">Ты меня уже забыл, не так ли?</div>
    </div>

</body>
</html>
